<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ResearchOS 3.1</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; overflow: hidden; }
        
        .login-field:focus-within {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            border-color: #2563EB;
        }

        /* 插画呼吸动效 */
        .illustration-float {
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .btn-premium {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>
    <div id="app" class="flex h-screen w-screen overflow-hidden">
        
        <!-- 左侧：登录控制区 (40%) -->
        <section class="w-full lg:w-[40%] h-full bg-white flex flex-col p-12 lg:p-20 relative z-20 shadow-[20px_0_60px_rgba(0,0,0,0.02)] border-r border-slate-100">
            <!-- 品牌 Logo -->
            <div class="flex items-center gap-3 mb-24 animate__animated animate__fadeInDown">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                    <svg class="text-white w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14H11V21L20 10H13Z"/></svg>
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-black tracking-tight text-slate-900 leading-none">ResearchOS</span>
                    <span class="text-[10px] font-black text-blue-600 uppercase tracking-[0.2em] mt-1">Enterprise Portal</span>
                </div>
            </div>

            <!-- 登录表单主体 -->
            <div class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full animate__animated animate__fadeIn">
                <div class="mb-12">
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight mb-3 italic">AUTHORIZE</h2>
                    <p class="text-slate-400 font-medium leading-relaxed">请输入您的凭证以访问 <span class="text-blue-600 font-bold">ResearchOS 3.1</span> 智能决策系统。</p>
                </div>

                <form @submit.prevent="handleLogin" class="space-y-6">
                    <div class="space-y-5">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] ml-1">Work Email</label>
                            <input type="email" v-model="email" required placeholder="analyst@researchos.ai"
                                class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none transition-all login-field">
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between items-center px-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Access Token</label>
                                <a href="#" class="text-[10px] font-bold text-blue-600 hover:underline">Reset</a>
                            </div>
                            <input type="password" v-model="password" required placeholder="••••••••••••"
                                class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none transition-all login-field">
                        </div>
                    </div>

                    <div class="flex items-center gap-3 px-1">
                        <input type="checkbox" id="trust" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-0">
                        <label for="trust" class="text-[11px] font-bold text-slate-400 uppercase cursor-pointer">信任此终端设备</label>
                    </div>

                    <button type="submit" :disabled="loading"
                        class="w-full btn-premium text-white py-5 rounded-2xl font-black text-xs uppercase tracking-[0.3em] transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-3 disabled:opacity-70">
                        <span v-if="!loading">同步身份进入</span>
                        <div v-else class="animate-spin h-5 w-5 border-2 border-white/30 border-t-white rounded-full"></div>
                        <svg v-if="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>
            </div>

            <!-- 底部状态 -->
            <footer class="mt-auto pt-10 flex justify-between items-center border-t border-slate-100">
                <div class="flex items-center gap-8">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest leading-tight">集群状态</span>
                        <div class="flex items-center gap-1.5 mt-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]"></div>
                            <span class="text-[10px] font-bold text-slate-600 tracking-tighter">ONLINE (12ms)</span>
                        </div>
                    </div>
                </div>
                <div class="text-[10px] font-bold text-slate-300 uppercase tracking-[0.3em]">
                    © 2026 RESEARCHOS
                </div>
            </footer>
        </section>

        <!-- 右侧：插画呈现区 (60%) -->
        <section class="hidden lg:flex lg:w-[60%] h-full bg-[#f8fbff] relative items-center justify-center overflow-hidden p-16">
            <!-- 这里的 src 指向你上传的 login.jpg -->
            <div class="relative w-full h-full flex items-center justify-center illustration-float animate__animated animate__zoomIn">
                <img src="login.jpg" 
                     alt="ResearchOS 3.1 架构插画" 
                     class="max-w-[95%] max-h-[90%] object-contain drop-shadow-[0_50px_80px_rgba(37,99,235,0.15)]">
            </div>

            <!-- 环境点缀 -->
            <div class="absolute inset-0 bg-[radial-gradient(#3b82f6_1.2px,transparent_1.2px)] [background-size:40px_40px] opacity-[0.04]"></div>
            <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-100/40 blur-[120px] rounded-full"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-indigo-50/50 blur-[100px] rounded-full"></div>
        </section>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const email = ref('');
                const password = ref('');
                const loading = ref(false);
                const handleLogin = () => {
                    loading.value = true;
                    setTimeout(() => loading.value = false, 2000);
                };
                return { email, password, loading, handleLogin };
            }
        }).mount('#app');
    </script>
</body>
</html>
